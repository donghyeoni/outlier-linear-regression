[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outlier-regression"
version = "0.1.0"
description = "Pure-NumPy study of gradient-based optimizers and outliers in linear regression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
